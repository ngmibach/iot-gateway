# Template — render with tools/render_config.py; do not deploy unrendered.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://{{MONITORING_IP}}:9090
    isDefault: true
    uid: prometheus
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    url: http://{{MONITORING_IP}}:3100
    uid: loki
    editable: true
    jsonData:
      maxLines: 1000
      httpMethod: POST
