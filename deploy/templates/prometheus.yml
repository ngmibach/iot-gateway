# Template — render with tools/render_config.py; do not deploy unrendered.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node'
    scrape_interval: 5s
    static_configs:
      - targets: ['{{GATEWAY_IP}}:9100']
        labels:
          instance: 'gateway'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['{{GATEWAY_IP}}:8080']
        labels:
          instance: 'gateway'

  - job_name: 'node-exporter-textfile'
    static_configs:
      - targets: ['{{GATEWAY_IP}}:9100']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'mqtt_connected_sensor.*'
        action: keep
