# Template — render with tools/render_config.py; do not deploy unrendered.
# Default path: monolithic gateway agent /metrics (no Docker / no cAdvisor).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'iot-gateway-agent'
    # Prometheus requires scrape_timeout <= scrape_interval or it refuses to start.
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /metrics
    static_configs:
      - targets: ['{{GATEWAY_IP}}:9139']
        labels:
          instance: 'gateway'
