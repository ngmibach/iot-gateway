name: Gitea Actions to Automatically Update Access Control Rule

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'User to update'
        required: true
        default: 'sensor3'
      readwrite_topics:
        description: 'New ReadWrite topics to ADD (comma-separated)'
        required: false
      read_topics:
        description: 'New Read topics to ADD (comma-separated)'
        required: false
      delete_readwrite:
        description: 'ReadWrite rules to DELETE (comma-separated). Leave empty to keep all existing.'
        required: false
        default: ''
      delete_read:
        description: 'Read rules to DELETE (comma-separated). Leave empty to keep all existing.'
        required: false
        default: ''

jobs:
  update-user:
    runs-on: ubuntu-system-arm
    container:
      image: localhost:5000/admin/gitea/runner-images:ubuntu-latest-arm
      volumes:
        - /workspace/share/iot-gateway/mosquitto/config/acl:/mosquitto/config/acl
        - /workspace/share/iot-gateway/docker-compose.yaml:/iot-gateway/docker-compose.yaml

    steps:
      - name: Update ACL permissions
        run: |
          set -euo pipefail

          ACL_FILE="/mosquitto/config/acl"
          COMPOSE_FILE="/iot-gateway/docker-compose.yaml"
          USERNAME="${{ github.event.inputs.username }}"
          RW_NEW="${{ github.event.inputs.readwrite_topics }}"
          READ_NEW="${{ github.event.inputs.read_topics }}"
          DELETE_RW="${{ github.event.inputs.delete_readwrite }}"
          DELETE_READ="${{ github.event.inputs.delete_read }}"

          echo "=== Updating ACL for user: $USERNAME ==="
          cp "$ACL_FILE" "$ACL_FILE.bak.$(date +%s)"

          normalize_delete() {
            echo "$1" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' || true
          }

          DELETE_RW_LIST=$(normalize_delete "$DELETE_RW")
          DELETE_READ_LIST=$(normalize_delete "$DELETE_READ")

          echo "Delete RW: [$DELETE_RW_LIST]"
          echo "Delete Read: [$DELETE_READ_LIST]"
          echo "Add RW: [$RW_NEW]"
          echo "Add Read: [$READ_NEW]"

          ACL_CONTENT=$(cat "$ACL_FILE")

          # First pass: Delete only if explicitly specified
          if [ -n "$DELETE_RW_LIST" ] || [ -n "$DELETE_READ_LIST" ]; then
            ACL_AFTER_DELETE=$(awk -v user="user $USERNAME" \
                -v del_rw="$DELETE_RW_LIST" \
                -v del_r="$DELETE_READ_LIST" '
            BEGIN {
              in_target = 0
              n_rw = split(del_rw, rw_arr, "\n")
              n_rd = split(del_r, rd_arr, "\n")
            }
            {
              if ($0 == user) {
                in_target = 1
                print $0
                next
              }
              if (in_target && $0 ~ /^user[ ]/) {
                in_target = 0
              }
              if (in_target) {
                delete_this = 0
                for (i = 1; i <= n_rw; i++) {
                  if (rw_arr[i] != "" && index($0, "topic readwrite " rw_arr[i]) == 1) {
                    delete_this = 1
                    break
                  }
                }
                if (!delete_this) {
                  for (i = 1; i <= n_rd; i++) {
                    if (rd_arr[i] != "" && index($0, "topic read " rd_arr[i]) == 1) {
                      delete_this = 1
                      break
                    }
                  }
                }
                if (delete_this) next
              }
              print $0
            }
            ' <<< "$ACL_CONTENT")
          else
            ACL_AFTER_DELETE="$ACL_CONTENT"
          fi

          # Second pass: Always append new rules
          FINAL_ACL=$(awk -v user="user $USERNAME" \
              -v rw_new="$RW_NEW" \
              -v read_new="$READ_NEW" '
          {
            print $0
            if ($0 == user) {
              if (rw_new != "" && rw_new != "none") {
                n = split(rw_new, topics, ",")
                for (i=1; i<=n; i++) {
                  gsub(/^[ \t]+|[ \t]+$/, "", topics[i])
                  if (topics[i] != "") {
                    print "topic readwrite " topics[i]
                  }
                }
              }
              if (read_new != "" && read_new != "none") {
                n = split(read_new, topics, ",")
                for (i=1; i<=n; i++) {
                  gsub(/^[ \t]+|[ \t]+$/, "", topics[i])
                  if (topics[i] != "") {
                    print "topic read " topics[i]
                  }
                }
              }
            }
          }
          ' <<< "$ACL_AFTER_DELETE")

          echo "$FINAL_ACL" > "$ACL_FILE"

          echo "✅ ACL updated successfully:"
          cat "$ACL_FILE"

          echo "Restarting Mosquitto..."
          docker compose -f "$COMPOSE_FILE" restart mosquitto

          echo "updated_user=$USERNAME" >> $GITHUB_OUTPUT
        shell: bash