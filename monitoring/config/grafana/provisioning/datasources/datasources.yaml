# Lab compose: Grafana is on iot-net; Prometheus uses network_mode: host.
# docker0 gateway (172.17.0.1) reaches host-network Prometheus from the container.
# Packaged installs render deploy/templates/grafana-datasources.yaml with {{MONITORING_IP}}.
# Do not use 127.0.0.1 here — that is the Grafana container loopback.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://172.17.0.1:9090
    isDefault: true
    uid: prometheus
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    editable: true
    jsonData:
      maxLines: 1000
      httpMethod: POST
