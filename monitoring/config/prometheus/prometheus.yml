global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node'
    scrape_interval: 5s
    static_configs:
      - targets: ['172.20.10.2:9100']
        labels:
          instance: 'raspberry-pi-gateway'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['172.20.10.2:8081']
        labels:
          instance: 'raspberry-pi-gateway'

  - job_name: 'node-exporter-textfile'
    static_configs:
      - targets: ['172.20.10.2:9100']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'mqtt_connected_sensor.*'
        action: keep