# Optional overlay — provision installs the agent last.
# Usage from gateway/:
#   docker compose -f docker-compose.yaml -f agent/docker-compose.agent.yaml up -d agent
#
# Paths below are relative to the project directory (gateway/) when the overlay
# is merged with docker-compose.yaml. Host networking so mDNS and :9138 are
# reachable on the LAN. Stack status stays on SSH compose-ps / Prometheus.

services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: iot-gateway-agent
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - AGENT_HOST=0.0.0.0
      - AGENT_PORT=9138
