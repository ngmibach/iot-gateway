# Optional overlay — provision installs the agent last.
# Usage from gateway/:
#   docker compose -f docker-compose.yaml -f agent/docker-compose.agent.yaml up -d agent
#
# Host networking so mDNS and :9138 are reachable on the LAN.

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-gateway-agent
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - AGENT_HOST=0.0.0.0
      - AGENT_PORT=9138
      - INSTALL_ROOT=/opt/iot-gateway
    volumes:
      # Best-effort docker compose ps against the gateway stack
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ..:/opt/iot-gateway:ro
