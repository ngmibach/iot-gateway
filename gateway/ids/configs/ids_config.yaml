gateway:
  gateway_subnet: 192.168.4.0/24
  default_block_seconds: 600

  # Match current runtime audit semantics
  packet_window_seconds: 3
  inference_interval_seconds: 1

  # Let metadata threshold override config threshold
  suspicious_threshold: null

  # Inference directly from Node-RED processed log file.
  capture_type: sensor_log
  mac_tracking: false
  allow_loopback_sources: true

  min_pkts: 1
  min_model_packets: 1
  ml_semantic_guard:
    enabled: false

  # IP decision smoothing
  ip_aggregation_window: 6
  min_windows_for_decision: 4
  min_attack_windows: 3
  attack_vote_ratio_threshold: 0.60
  ip_avg_score_threshold: 0.68

  device_whitelist_path: /app/configs/device_whitelist.yaml

  # Not used in message mode, keep empty for clarity
  sensor_log:
    path: /app/nodered_logs/sensor_data.log

model:
  type: lightgbm
  path: models/ids_model.joblib
  scaler_path: models/feature_scaler.joblib

  expected_features:
    - msg_count
    - topic_unique_count
    - topic_flood_ratio
    - process_path_ratio
    - avg_payload_len
    - std_payload_len
    - min_payload_len
    - max_payload_len
    - mean_inter_arrival_ms
    - std_inter_arrival_ms
    - avg_delay
    - max_delay
    - attack_blob_ratio

training:
  dataset_path: data/processed/ids_features_gateway_message.csv
  label_column: label
  test_size: 0.2
  random_state: 42
  split_strategy: group
  group_column: source_group
  time_column: window_start_ts
