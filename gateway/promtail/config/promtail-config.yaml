server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://172.17.0.1:3100/loki/api/v1/push

scrape_configs:

  - job_name: mosquitto
    static_configs:
      - targets: [localhost]
        labels:
          job: mosquitto
          container: iot-mosquitto
          __path__: /mosquitto/log/mosquitto.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ts>\d+): .*?(?P<event>New client connected|Sending PUBLISH|Denied PUBLISH|Received PINGREQ|Received DISCONNECT|Received PUBLISH|Sending PUB|mosquitto version).*?(?P<client>nodered[^ ]*|auto-[^ ]*|sensor\d+)?'
      - labels:
          event:
          client:
      - timestamp:
          source: ts
          format: unix

  - job_name: nodered
    static_configs:
      - targets: [localhost]
        labels:
          job: nodered
          container: iot-nodered
          __path__: /data/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            deviceId: deviceId
            event_type: event_type
            topic: topic
            timestamp: timestamp
            source_ip: source_ip
      - drop:
          source: "deviceId"
          value: "" 
      - drop:
          source: "event_type"
          value: ""
      - labels:
          deviceId:
          event_type:
          topic:
      - timestamp:
          source: timestamp
          format: RFC3339
