name: Desktop packages (AppImage + Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/desktop/**"
      - "apps/control-service/**"
      - ".github/workflows/desktop-packages.yml"
    branches: ["main", "feat/clickable-desktop-app"]

jobs:
  linux-appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            python3 python3-venv python3-pip
      - name: Python venv (for beforeDev / runtime smoke)
        run: |
          python3 -m venv apps/desktop/.venv
          apps/desktop/.venv/bin/pip install -r apps/desktop/requirements.txt \
            -r apps/control-service/requirements.txt
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build AppImage
        working-directory: apps/desktop
        run: cargo tauri build --bundles appimage
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: iot-gateway-monitor-linux-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        shell: bash
        run: |
          python -m venv apps/desktop/.venv
          apps/desktop/.venv/Scripts/pip install -r apps/desktop/requirements.txt \
            -r apps/control-service/requirements.txt
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build MSI + NSIS
        working-directory: apps/desktop
        run: cargo tauri build --bundles msi,nsis
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: iot-gateway-monitor-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
