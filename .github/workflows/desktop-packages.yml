name: Desktop packages (AppImage + Windows exe)

# Lives on main (source of truth) and is mirrored on linux / windows.
# Triggers:
#   - push to `linux`   → build AppImage → publish/update Release asset
#   - push to `windows` → build .exe     → publish/update Release asset
#   - workflow_dispatch → build chosen platform(s) manually
#
# Repo keeps only three long-lived branches: main, linux, windows.

on:
  push:
    branches: [linux, windows]
  workflow_dispatch:
    inputs:
      platform:
        description: "Which package(s) to build"
        type: choice
        options:
          - linux
          - windows
          - both
        default: both
      publish_release:
        description: "Publish/update the GitHub Release (desktop-latest)"
        type: boolean
        default: true
      tag:
        description: "Release tag to create or update"
        type: string
        default: "desktop-latest"

permissions:
  contents: write

jobs:
  linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04
    if: >-
      github.ref_name == 'linux'
      || (github.event_name == 'workflow_dispatch'
          && (inputs.platform == 'linux' || inputs.platform == 'both'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 file desktop-file-utils \
            libxcb-xinerama0 libxkbcommon-x11-0 libglib2.0-0

      - name: Build AppImage
        working-directory: apps/desktop
        env:
          IOTGW_DIST: ${{ github.workspace }}/apps/desktop/dist
        run: bash packaging/build_linux_appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: iot-gateway-monitor-linux-appimage
          path: |
            apps/desktop/dist/IoTGatewayMonitor-*.AppImage
            apps/desktop/dist/SHA256SUMS-linux.txt
          if-no-files-found: error

  windows-exe:
    name: Build Windows exe
    runs-on: windows-latest
    if: >-
      github.ref_name == 'windows'
      || (github.event_name == 'workflow_dispatch'
          && (inputs.platform == 'windows' || inputs.platform == 'both'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows .exe
        shell: bash
        env:
          IOTGW_DIST: ${{ github.workspace }}/apps/desktop/dist
          IOTGW_PYI_ONEFILE: "1"
          IOTGW_PYI_CONSOLE: "0"
        run: bash apps/desktop/packaging/build_windows.sh

      # Optional Authenticode: set repo secrets WINDOWS_CODE_SIGN_PFX_BASE64 +
      # WINDOWS_CODE_SIGN_PFX_PASSWORD so Chrome/Defender stop treating the
      # GitHub Release EXE as an unsigned PyInstaller drop. Skips cleanly when unset.
      - name: Authenticode sign Windows exe
        shell: pwsh
        env:
          IOTGW_DIST: ${{ github.workspace }}/apps/desktop/dist
          WINDOWS_CODE_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_PFX_BASE64 }}
          WINDOWS_CODE_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_PFX_PASSWORD }}
          WINDOWS_CODE_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODE_SIGN_TIMESTAMP_URL }}
        run: ./apps/desktop/packaging/sign_windows_ci.ps1

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: iot-gateway-monitor-windows-exe
          path: |
            apps/desktop/dist/IoTGatewayMonitor.exe
            apps/desktop/dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [linux-appimage, windows-exe]
    # One platform job is often skipped; publish whenever at least one built.
    if: >-
      always()
      && (needs.linux-appimage.result == 'success'
          || needs.windows-exe.result == 'success')
      && (needs.linux-appimage.result != 'failure'
          && needs.windows-exe.result != 'failure')
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: iot-gateway-monitor-*
          path: release-assets
          merge-multiple: true

      - name: Flatten assets
        run: |
          mkdir -p dist
          find release-assets -type f \( -name '*.AppImage' -o -name '*.exe' -o -name 'SHA256SUMS*' \) \
            -exec cp -v {} dist/ \;
          ls -lh dist
          {
            echo "### Files"
            ls -lh dist | sed 's/^/ /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            # Continuous downloadable build from linux/windows pushes
            TAG="desktop-latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Publishing release tag: $TAG (from ${GITHUB_REF_NAME})"

      # softprops/action-gh-release fails updating the existing desktop-latest
      # release from non-default branches (windows/linux) with a bare HttpError
      # while rewriting release metadata / generate_release_notes. Asset replace
      # via `gh release upload --clobber` is enough for this floating tag.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_BRANCH: ${{ steps.tag.outputs.branch }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TITLE="IoT Gateway Monitor ${RELEASE_TAG}"
          NOTES_FILE="$(mktemp)"
          {
            echo "## Download & run"
            echo
            echo "| Platform | File | How to run |"
            echo "|----------|------|------------|"
            echo "| **Windows** | \`IoTGatewayMonitor.exe\` | Download → double-click |"
            echo "| **Ubuntu / Linux** | \`IoTGatewayMonitor-x86_64.AppImage\` | Download → \`chmod +x\` once → double-click |"
            echo
            echo "Built from branch \`${RELEASE_BRANCH}\`."
            echo "Push to **\`linux\`** rebuilds the AppImage; push to **\`windows\`** rebuilds the \`.exe\`."
            echo "Same-named assets on this release are replaced on each successful build."
            echo
            echo "Windows builds are Authenticode-signed in CI when the"
            echo "\`WINDOWS_CODE_SIGN_PFX_*\` repository secrets are configured."
            echo "Unsigned PyInstaller EXEs are often blocked by Chrome Safe Browsing"
            echo "and Defender (\`Trojan:Win32/Wacatac.*\` false positives)."
            echo
            echo "No Python, Rust, or CLI setup required. Day-to-day work is done in the app UI."
          } >"$NOTES_FILE"
          shopt -s nullglob
          assets=(dist/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No files under dist/ to publish" >&2
            exit 1
          fi
          ls -lh "${assets[@]}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes-file "$NOTES_FILE" || \
              echo "Release metadata edit skipped (non-fatal on non-default branch)"
          else
            prerelease_args=()
            if [[ "$RELEASE_TAG" == "desktop-latest" ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${prerelease_args[@]}" \
              --title "$TITLE" --notes-file "$NOTES_FILE" \
              --target "$RELEASE_SHA"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          echo "Published ${#assets[@]} asset(s) to $RELEASE_TAG"
