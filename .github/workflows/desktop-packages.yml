name: Desktop packages (AppImage + Windows exe)

# Lives on main (source of truth) and is mirrored on linux / windows.
# Triggers:
#   - push to `linux`   → build AppImage → publish/update Release asset
#   - push to `windows` → build .exe     → publish/update Release asset
#   - workflow_dispatch → build chosen platform(s) manually
#
# Repo keeps only three long-lived branches: main, linux, windows.

on:
  push:
    branches: [linux, windows]
  workflow_dispatch:
    inputs:
      platform:
        description: "Which package(s) to build"
        type: choice
        options:
          - linux
          - windows
          - both
        default: both
      publish_release:
        description: "Publish/update the GitHub Release (desktop-latest)"
        type: boolean
        default: true
      tag:
        description: "Release tag to create or update"
        type: string
        default: "desktop-latest"

permissions:
  contents: write

jobs:
  linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04
    if: >-
      github.ref_name == 'linux'
      || (github.event_name == 'workflow_dispatch'
          && (inputs.platform == 'linux' || inputs.platform == 'both'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 file desktop-file-utils \
            libxcb-xinerama0 libxkbcommon-x11-0 libglib2.0-0

      - name: Build AppImage
        working-directory: apps/desktop
        env:
          IOTGW_DIST: ${{ github.workspace }}/apps/desktop/dist
        run: bash packaging/build_linux_appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: iot-gateway-monitor-linux-appimage
          path: |
            apps/desktop/dist/IoTGatewayMonitor-*.AppImage
            apps/desktop/dist/SHA256SUMS-linux.txt
          if-no-files-found: error

  windows-exe:
    name: Build Windows exe
    runs-on: windows-latest
    if: >-
      github.ref_name == 'windows'
      || (github.event_name == 'workflow_dispatch'
          && (inputs.platform == 'windows' || inputs.platform == 'both'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows .exe
        shell: bash
        env:
          IOTGW_DIST: ${{ github.workspace }}/apps/desktop/dist
          IOTGW_PYI_ONEFILE: "1"
          IOTGW_PYI_CONSOLE: "0"
        run: bash apps/desktop/packaging/build_windows.sh

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: iot-gateway-monitor-windows-exe
          path: |
            apps/desktop/dist/IoTGatewayMonitor.exe
            apps/desktop/dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [linux-appimage, windows-exe]
    # One platform job is often skipped; publish whenever at least one built.
    if: >-
      always()
      && (needs.linux-appimage.result == 'success'
          || needs.windows-exe.result == 'success')
      && (needs.linux-appimage.result != 'failure'
          && needs.windows-exe.result != 'failure')
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: iot-gateway-monitor-*
          path: release-assets
          merge-multiple: true

      - name: Flatten assets
        run: |
          mkdir -p dist
          find release-assets -type f \( -name '*.AppImage' -o -name '*.exe' -o -name 'SHA256SUMS*' \) \
            -exec cp -v {} dist/ \;
          ls -lh dist
          {
            echo "### Files"
            ls -lh dist | sed 's/^/ /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            # Continuous downloadable build from linux/windows pushes
            TAG="desktop-latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Publishing release tag: $TAG (from ${GITHUB_REF_NAME})"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: IoT Gateway Monitor ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ steps.tag.outputs.tag == 'desktop-latest' }}
          generate_release_notes: true
          body: |
            ## Download & run

            | Platform | File | How to run |
            |----------|------|------------|
            | **Windows** | `IoTGatewayMonitor.exe` | Download → double-click |
            | **Ubuntu / Linux** | `IoTGatewayMonitor-x86_64.AppImage` | Download → `chmod +x` once → double-click |

            Built from branch `${{ steps.tag.outputs.branch }}`.
            Push to **`linux`** rebuilds the AppImage; push to **`windows`** rebuilds the `.exe`.
            Same-named assets on this release are replaced on each successful build.

            No Python, Rust, or CLI setup required. Day-to-day work is done in the app UI.
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
