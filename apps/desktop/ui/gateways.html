<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IoT Gateway — Gateways</title>
  <link rel="stylesheet" href="wizard.css" />
</head>
<body data-page="gateways">
  <header>
    <div>
      <h1 id="page-title">Gateways</h1>
      <div class="sub" id="page-sub">Registration · Settings · Clean up</div>
    </div>
    <div id="hdr-status"></div>
  </header>
  <main>
    <section class="panel gw-panel" data-tab="registration" id="tab-registration">
      <h2>Registration</h2>

      <div id="reg-find">
        <div class="row">
          <button type="button" class="primary" id="btn-scan-gw">Find gateway</button>
          <span id="scan-badge"></span>
        </div>
        <div class="note-box" id="scan-msg"></div>
      </div>

      <div id="reg-results" class="hidden">
        <h3>Found devices</h3>
        <ul class="host-list" id="host-list"></ul>
      </div>

      <div id="reg-install" class="hidden">
        <h3>Gateway</h3>
        <div class="row">
          <label for="reg-host">
            Host
            <span class="field-help" tabindex="0" aria-label="What is Host?">?
              <span class="field-help-tip">Gateway address from Find gateway.</span>
            </span>
          </label>
          <input id="reg-host" readonly />
        </div>
        <div class="row">
          <label for="ssh-user">
            User
            <span class="field-help" tabindex="0" aria-label="What is User?">?
              <span class="field-help-tip">Login name for the gateway.</span>
            </span>
          </label>
          <input id="ssh-user" autocomplete="username" />
        </div>
        <div class="row">
          <label for="ssh-pass">
            Password
            <span class="field-help" tabindex="0" aria-label="What is Password?">?
              <span class="field-help-tip">Password to install on the gateway.</span>
            </span>
          </label>
          <input id="ssh-pass" type="password" autocomplete="off" />
        </div>
        <div class="row">
          <label for="ssh-gid">
            Gateway ID
            <span class="field-help" tabindex="0" aria-label="What is Gateway ID?">?
              <span class="field-help-tip">Name for this gateway in the app.</span>
            </span>
          </label>
          <input id="ssh-gid" value="gateway" />
        </div>
        <div class="row">
          <label for="sudo-pass">
            Sudo password
            <span class="field-help" tabindex="0" aria-label="What is Sudo password?">?
              <span class="field-help-tip">Admin password for gateway install.</span>
            </span>
          </label>
          <input id="sudo-pass" type="password" autocomplete="new-password" />
        </div>
        <div class="row">
          <input type="checkbox" id="ca-auto" checked />
          <label for="ca-auto" style="min-width:auto">
            Generate CA passphrase
            <span class="field-help" tabindex="0" aria-label="What is Generate CA passphrase?">?
              <span class="field-help-tip">Creates a signing password for this gateway.</span>
            </span>
          </label>
        </div>
        <div class="row hidden" id="ca-pass-row">
          <label for="ca-pass">
            CA passphrase
            <span class="field-help" tabindex="0" aria-label="What is CA passphrase?">?
              <span class="field-help-tip">Signing password for this gateway.</span>
            </span>
          </label>
          <input id="ca-pass" type="password" autocomplete="off" />
        </div>
        <div class="row">
          <button type="button" class="primary" id="btn-provision-agent">Install gateway</button>
        </div>
        <div id="provision-msg"></div>
      </div>
    </section>

    <section class="panel gw-panel hidden" data-tab="settings" id="tab-settings">
      <h2>Settings</h2>
      <p class="muted">Configure a registered gateway.</p>

      <div class="row">
        <label for="cfg-gateway-id">Gateway</label>
        <select id="cfg-gateway-id"></select>
      </div>

      <h3>Connection</h3>
      <div class="row">
        <label for="cfg-host">Host / IP</label>
        <input id="cfg-host" readonly />
      </div>
      <div class="row">
        <label for="cfg-user">Username</label>
        <input id="cfg-user" autocomplete="username" />
      </div>
      <div class="row">
        <label for="cfg-pass">Password</label>
        <input id="cfg-pass" type="password" autocomplete="off" />
      </div>
      <div class="row">
        <button type="button" class="primary" id="btn-save-cfg">Save</button>
      </div>
      <div id="cfg-msg"></div>
    </section>

    <section class="panel gw-panel hidden" data-tab="cleanup" id="tab-cleanup">
      <h2>Clean up</h2>

      <div class="row">
        <label for="cu-gateway-id">Gateway</label>
        <select id="cu-gateway-id"></select>
      </div>
      <div class="row">
        <label for="cu-sudo">Password</label>
        <input
          id="cu-sudo"
          type="password"
          autocomplete="off"
        />
      </div>
      <div class="row">
        <button type="button" class="danger" id="btn-cu-confirm" disabled>Remove gateway</button>
      </div>
      <div id="cu-msg"></div>
    </section>
  </main>
  <script src="app-shell.js"></script>
  <script src="gateways.js"></script>
</body>
</html>
