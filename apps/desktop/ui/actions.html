<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IoT Gateway — Control Plane</title>
  <link rel="stylesheet" href="wizard.css" />
</head>
<body data-page="actions">
  <header>
    <div>
      <h1>Control Plane</h1>
      <div class="sub">Registration · View</div>
    </div>
    <div id="hdr-status"></div>
  </header>
  <main>
    <section class="panel">
      <div class="row">
        <label for="gw-select">Gateway</label>
        <select id="gw-select"></select>
        <button type="button" class="secondary" id="btn-load-gw">Refresh</button>
      </div>
      <div id="ctrl-msg"></div>
    </section>

    <nav class="tabs" id="action-tabs">
      <button type="button" data-action="register" class="active">Registration</button>
      <button type="button" data-action="view">View</button>
    </nav>

    <section class="panel action-panel" data-action="register" id="panel-register">
      <h2>Sensor registration</h2>
      <p class="muted">Register a sensor or edge device on the selected gateway.</p>
      <div class="row">
        <label for="reg-user">Device ID</label>
        <input id="reg-user" autocomplete="off" placeholder="sensor5" />
      </div>
      <div class="row">
        <label for="reg-pass">Password</label>
        <input id="reg-pass" type="password" autocomplete="off" />
      </div>
      <div class="row">
        <label for="reg-ip">Device IP</label>
        <input id="reg-ip" placeholder="192.168.1.60" />
      </div>
      <div class="row">
        <label for="reg-topic-rw">Topic RW</label>
        <input id="reg-topic-rw" placeholder="sensors/sensor5/#" />
      </div>
      <div class="row">
        <label for="reg-topic-r">Topic R</label>
        <input id="reg-topic-r" placeholder="alerts/+" />
      </div>
      <div class="row">
        <label for="reg-ca">CA passphrase</label>
        <input
          id="reg-ca"
          type="password"
          autocomplete="off"
          placeholder="optional if already configured"
        />
      </div>
      <div class="row">
        <button type="button" class="primary" id="btn-register">Register</button>
      </div>
      <div id="reg-msg"></div>
      <div id="reg-download" class="hidden"></div>
    </section>

    <section class="panel action-panel hidden" data-action="view" id="panel-view">
      <h2>Registered sensors</h2>
      <p class="muted">Select a device to review or change its settings.</p>

      <div class="row">
        <label for="view-device">Device</label>
        <select id="view-device"></select>
        <button type="button" class="secondary" id="btn-refresh-view">Refresh</button>
      </div>

      <div id="view-empty" class="muted">No devices registered on this gateway.</div>

      <div id="view-form" class="hidden">
        <div class="row">
          <label for="view-id">Device ID</label>
          <input id="view-id" readonly />
        </div>
        <div class="row">
          <label for="view-ip">Device IP</label>
          <input id="view-ip" />
        </div>
        <div class="row">
          <label for="view-topic-rw">Topic RW</label>
          <input id="view-topic-rw" />
        </div>
        <div class="row">
          <label for="view-topic-r">Topic R</label>
          <input id="view-topic-r" />
        </div>
        <div class="row">
          <label for="view-pass">Password</label>
          <input
            id="view-pass"
            type="password"
            autocomplete="off"
            placeholder="required only when changing IP, topics, or credentials"
          />
        </div>
        <div class="row">
          <label for="view-ca">CA passphrase</label>
          <input
            id="view-ca"
            type="password"
            autocomplete="off"
            placeholder="optional if already configured"
          />
        </div>
        <div class="row">
          <input type="checkbox" id="view-monitor" />
          <label for="view-monitor" style="min-width:auto">Monitor this device</label>
        </div>
        <div class="row">
          <label>Fingerprint</label>
          <span class="mono" id="view-fp">—</span>
        </div>
        <div class="row">
          <label>Expires</label>
          <span id="view-expires">—</span>
        </div>

        <div id="view-msg"></div>
        <div id="view-download" class="hidden"></div>

        <div class="row">
          <input type="checkbox" id="view-delete-confirm" />
          <label for="view-delete-confirm" style="min-width:auto">
            I am confirming that I want to delete this
          </label>
        </div>
        <div class="row">
          <input type="checkbox" id="view-remove-ip" />
          <label for="view-remove-ip" style="min-width:auto">
            Also remove IP from the gateway allow-list
          </label>
        </div>
        <div class="row view-actions">
          <button type="button" class="primary hidden" id="btn-view-update">Update</button>
          <button type="button" class="danger" id="btn-view-delete" disabled>Delete</button>
        </div>
      </div>
    </section>
  </main>
  <script src="app-shell.js"></script>
  <script src="actions.js"></script>
</body>
</html>
