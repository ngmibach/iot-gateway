<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IoT Gateway — Monitoring</title>
  <link rel="stylesheet" href="wizard.css" />
  <link rel="stylesheet" href="monitoring.css" />
</head>
<body data-page="monitoring">
  <header>
    <div>
      <h1>Monitoring</h1>
      <div class="sub">Metric · Activities · Control Plane</div>
    </div>
    <div class="hdr-actions">
      <span id="hdr-status"></span>
    </div>
  </header>
  <main class="monitoring-main">
    <div id="origin-banner" class="note-box hidden"></div>
    <div id="warn-banner" class="note-box hidden"></div>
    <div class="row toolbar" id="mon-toolbar">
      <label for="gateway-id">Gateway</label>
      <select id="gateway-id"></select>
      <label for="range">Range</label>
      <select id="range">
        <option value="15m">15m</option>
        <option value="1h" selected>1h</option>
        <option value="6h">6h</option>
        <option value="24h">24h</option>
      </select>
      <label class="chk">
        <input type="checkbox" id="show-all" />
        Show all Loki deviceIds
      </label>
      <button class="secondary" id="btn-refresh">Refresh</button>
      <label class="chk">
        <input type="checkbox" id="auto-refresh" checked />
        Auto 15s
      </label>
    </div>

    <!-- Tab chrome lives in the left rail (Gateway Metric / Gateway Activities). -->
    <nav class="steps mon-subtabs hidden" id="mon-tabs" aria-hidden="true"></nav>

    <section class="panel mon-panel" data-tab="metric" id="tab-metric">
      <h2>Gateway Metric</h2>
      <div class="metrics" id="raspi-metrics"></div>
      <h3>CPU sparkline</h3>
      <div id="raspi-spark" class="spark-lg"></div>
      <div id="raspi-msg" class="muted"></div>
    </section>

    <section class="panel mon-panel hidden" data-tab="activities" id="tab-activities">
      <h2>Gateway Activities</h2>
      <div class="metrics" id="gw-metrics"></div>
      <h3>Connected sensors</h3>
      <div class="table-wrap"><table id="gw-connected"><thead></thead><tbody></tbody></table></div>
      <h3>Transmission delay</h3>
      <div class="table-wrap"><table id="gw-delay"><thead></thead><tbody></tbody></table></div>
      <div id="gw-msg" class="muted"></div>

      <h2 class="activities-sensors-heading">Sensors Reading</h2>
      <p class="muted" id="sensors-filter-note"></p>
      <h3>Sintering stage</h3>
      <div class="metrics" id="sensors-stages"></div>
      <h3>Temperatures</h3>
      <div class="table-wrap"><table id="sensors-temp"><thead></thead><tbody></tbody></table></div>
      <h3>Pressure</h3>
      <div class="table-wrap"><table id="sensors-pressure"><thead></thead><tbody></tbody></table></div>
      <div id="sensors-msg" class="muted"></div>
    </section>
  </main>
  <script src="app-shell.js"></script>
  <script src="monitoring.js"></script>
</body>
</html>
