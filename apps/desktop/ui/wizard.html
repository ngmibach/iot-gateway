<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IoT Gateway Monitor — Setup</title>
  <link rel="stylesheet" href="wizard.css" />
</head>
<body class="first-run" data-page="wizard">
  <header>
    <div>
      <h1>IoT Gateway Monitor</h1>
    </div>
    <div id="hdr-status"></div>
  </header>
  <main>
    <div class="first-run-banner" id="first-run-banner">
      Welcome
    </div>

    <section class="panel" id="step-engine">
      <h2>Monitoring</h2>
      <p class="muted">
        Install Loki, Prometheus, and Grafana on this PC. Configure the LAN and register
        gateways later under Gateways.
      </p>
      <div class="row">
        <button class="primary" id="btn-prepare-telemetry">Install monitoring</button>
        <button class="secondary" id="btn-open-mon-early" disabled>
          Open app
        </button>
        <span id="telemetry-badge"></span>
      </div>
      <div class="note-box" id="telemetry-hint"></div>
    </section>
  </main>
  <script src="app-shell.js"></script>
  <script src="wizard.js"></script>
</body>
</html>
