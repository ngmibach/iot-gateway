[package]
name = "iot-gateway-monitor"
version = "0.1.0"
description = "IoT Gateway Monitor — Setup Wizard + WebView→Streamlit (Phase-0)"
authors = ["iot-gateway"]
edition = "2021"

[lib]
name = "iot_gateway_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
